name: Build, test and push sim mode container
on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - beta
  pull_request:
    branches:
      - develop
      - beta
      - stable
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
    - name: Check that /dev/urandom exists
      run: ls /dev/urandom
    - name: Login to docker
      if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/beta'
      run: docker login -u ${DOCKER_USERNAME} -p ${DOCKER_PASSWORD}
    - uses: actions/checkout@v4
    - name: Clean & Reset submodules
      run: ./clean.sh --full
    - name: Calculate and cache VERSION
      if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/beta'
      run : |
            export BRANCH=${GITHUB_REF##*/}
            echo "Branch $BRANCH"
            export CURRENT_VERSION=$(cat VERSION)
            echo "Current Version $CURRENT_VERSION"
            export NEW_VERSION=$(bash ./scripts/calculate_version.sh $BRANCH $CURRENT_VERSION)
            echo "New Version $NEW_VERSION"
            echo "VERSION=$NEW_VERSION" >> $GITHUB_ENV
            echo "BRANCH=$BRANCH" >> $GITHUB_ENV
    - name: Update VERSION file
      if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/beta'
      run : |
            echo "Updating VERSION file with $VERSION"
            echo "$VERSION" > VERSION
    - name: Build container
      run: bash ./scripts/build_image.sh DockerfileSimulation sgxwallet_sim
    - name: test
      run: |
        ulimit -n 65535
        # Same tag as build_image.sh: the calculated VERSION, or the commit SHA for unpublished builds
        python3 scripts/docker_test.py DockerfileSimulation sgxwallet_sim ${VERSION-$(git rev-parse HEAD)}
    - name: cleanup
      if: always()
      run: sudo rm -rf sgx_data
    - name: deploy docker image
      env:
          VERSION: ${{ env.VERSION }}
          BRANCH: ${{ env.BRANCH }}
      if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/beta'
      run : |
            echo "Branch $BRANCH"
            echo "Using cached version $VERSION"
            bash ./scripts/publish_image.sh sgxwallet_sim


