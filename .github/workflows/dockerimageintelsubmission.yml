name: Build, test and push Intel SGX container
on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - beta
      - stable
  pull_request:
    branches:
      - develop
      - beta
      - stable
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - name: Login to docker
        if: |
          github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/beta' ||
          github.ref == 'refs/heads/stable'
        run: docker login -u ${DOCKER_USERNAME} -p ${DOCKER_PASSWORD}
      - uses: actions/checkout@v4
      - name: submodule update
        run: git submodule update --init --recursive
      - name: Calculate and cache VERSION
        if: |
          github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/beta' ||
          github.ref == 'refs/heads/stable'
        run : |
          export BRANCH=${GITHUB_REF##*/}
          echo "Branch $BRANCH"
          export CURRENT_VERSION=$(cat VERSION)
          echo "Current Version $CURRENT_VERSION"
          export NEW_VERSION=$(bash ./scripts/calculate_version.sh $BRANCH $CURRENT_VERSION)
          echo "New Version $NEW_VERSION"
          echo "VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
      - name: Update VERSION file
        if: |
          github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/beta' ||
          github.ref == 'refs/heads/stable'
        run : |
          echo "Updating VERSION file with $VERSION"
          echo "$VERSION" > VERSION
      - name: build docker image
        run: bash ./scripts/build_image.sh DockerfileIntelSubmission sgxwallet_intelsubmission
      - name: deploy docker image
        env:
          VERSION: ${{ env.VERSION }}
          BRANCH: ${{ env.BRANCH }}
        if: |
          github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/beta' ||
          github.ref == 'refs/heads/stable'
        run : |
          echo "Branch $BRANCH"
          echo "Using cached version $VERSION"
          bash ./scripts/publish_image.sh sgxwallet_intelsubmission
