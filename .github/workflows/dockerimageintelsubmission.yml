name: Build, test and push Intel SGX container
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: self-hosted
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - name: Fail, if older Github Actions machine. Click "Re-run jobs"
        run: cat /proc/cpuinfo | grep avx512
      - name: Login to docker
        run: docker login -u ${DOCKER_USERNAME} -p ${DOCKER_PASSWORD}
      - uses: actions/checkout@v2
      - name: submodule update
        run: git submodule update --init --recursive
      - name: build and deploy test image
        run: python3 scripts/docker_build.py DockerfileIntelSubmission sgxwallet_intelsubmission ${GITHUB_SHA}
      - name: Calculate and cache VERSION
        if: |    
          contains(github.ref, 'develop') || contains(github.ref, 'beta') ||
          contains(github.ref, 'master') || contains(github.ref, 'stable') ||
          contains(github.ref, 'SECURE_ENCLAVE_CHANGES')
        run : |
          export BRANCH=${GITHUB_REF##*/}
          echo "Branch $BRANCH"
          export CURRENT_VERSION=$(cat VERSION)
          echo "Current Version $CURRENT_VERSION"
          export NEW_VERSION=$(bash ./scripts/calculate_version.sh $BRANCH $CURRENT_VERSION)
          echo "New Version $NEW_VERSION"
          echo "VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
      - name: Update VERSION file
        if: |    
          contains(github.ref, 'develop') || contains(github.ref, 'beta') ||
          contains(github.ref, 'master') || contains(github.ref, 'stable') ||
          contains(github.ref, 'SECURE_ENCLAVE_CHANGES')
        run : |
          echo "Updating VERSION file with $VERSION"
          echo "$VERSION" > VERSION
      - name: build and deploy docker image
        env:
          VERSION: ${{ env.VERSION }}
          BRANCH: ${{ env.BRANCH }}
        if: |    
          contains(github.ref, 'develop') || contains(github.ref, 'beta') ||
          contains(github.ref, 'master') || contains(github.ref, 'stable') ||
          contains(github.ref, 'SECURE_ENCLAVE_CHANGES')
        run : |
          echo "Branch $BRANCH"
          echo "Using cached version $VERSION"
          export RELEASE=true
          echo "::set-env name=RELEASE::$RELEASE"
          bash ./scripts/build_image.sh DockerfileIntelSubmission sgxwallet_intelsubmission
          bash ./scripts/publish_image.sh sgxwallet_intelsubmission
        env:
          ACTIONS_ALLOW_UNSECURE_COMMANDS: true
